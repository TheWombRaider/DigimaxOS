# DigimaxOS device profile: Samsung Digimax A402 (alias Kenox D402)
#
# Every field carries a status:
#   verified   - observed on the reference unit, with an experiment ID
#   documented - stated by an OEM document (source ID), not yet observed
#   unknown    - not established; tools must not rely on it
#
# Tools MUST refuse to act on a device or firmware that does not exactly match a
# verified profile field they depend on (requirement CORE-02).

