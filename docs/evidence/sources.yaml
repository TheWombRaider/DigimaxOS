  - id: S10
    title: Samsung A402/D402 USB driver package (Windows 98)
    kind: oem-download
    url: https://org.downloadcenter.samsung.com/downloadfile/ContentsFile.aspx?CDSite=UNI_UK&OriginYN=N&ModelType=N&ModelName=DIGIMAX+A402&CttFileID=1848962&CDCttType=DR&VPath=DR%2F200802%2F20080216103900687_A402_D402.zip
    retrieved: 2026-11-14
    sha256: 7f865bedb1bd6f84a0541525275cea1e8944585e52ae30cd7a8c7c02d7e08ce4
    redistributable: false
    location: private workspace oem/samsung-driver-2008/ (not in Git)
    notes: >-
      Inspected without executing anything. A402.inf: provider/manufacturer "Samsung Techwin",
      hardware ID USB\VID_0839&PID_003C "Samsung Digital Camera", USB mass-storage port driver
      (A402.SYS, A402.pdr), sections for CBI, CB and Bulk-Only protocols. Setup.ini AppName:
      "Digimax A402, KENOX D402". File dates 2004-12-07 (driver) to 2005-01-25 (installer). Contains
      no firmware.

  - id: S11
    title: Linux USB ID repository (usb.ids)
    kind: database
    url: http://www.linux-usb.org/usb.ids
    retrieved: 2026-11-14
    redistributable: true
    notes: >-
      Vendor 0839 = "Samsung Techwin Co., Ltd". Lists Digimax 210SE/220/230/300/340/360/410/V4/S500/
      D830/50 Duo/35 MP3 and others; product 003c is NOT listed (candidate upstream submission).

  - id: S12
    title: Gumpack camera teardown (SPCA1527A/SPCA533A discussion)
    kind: article
    url: https://www.pluc.fr/2010/02/tear-down-and-hacking-around-gumpack-camera/comment-page-1/
    retrieved: 2026-11-14
    redistributable: false
    notes: >-
      Different Sunplus camera. SPI flash dumped off-board; 8051 disassembly gave plausible code,
      ARM/MIPS/AVR did not; firmware copied flash->RAM at boot; no checksum found on its modified
      image; strings ISP.BIN, FW.BIN, ISPKEY.TXT, DRAMPARA.TXT. Readers cite an SPCA533A datasheet
      describing an on-chip 8032. Methodology hint only - not evidence about the A402.

