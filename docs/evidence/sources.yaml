# DigimaxOS source registry.
#
# Every factual claim in the docs cites one of these IDs. Manuals and OEM files are
# *linked references*, never project assets: `redistributable` records whether we may copy
# them (almost always false/unknown). Private copies, where they exist, live only in the
# maintainer's private workspace and are identified here by hash.
#
# kind: manual | service-manual | oem-download | datasheet | standard | source-code |
#       database | article | product-page | observation
# Schema is checked by tests/test_cli_and_repo.py::test_sources_registry_schema.

sources:
  - id: S1
    title: Samsung Digimax A402 user manual
    kind: manual
    url: https://www.manualslib.com/manual/145735/Samsung-Digimax-A402.html
    retrieved: 2026-11-14
    pages: "web pp. 30-33 (shooting modes, Night mode, +/- control), 36, 85-86 (specifications)"
    redistributable: false
    notes: >-
      Specifications (printed p.85): 1/2.5" CCD 4.0 MP effective; 5.8 mm lens F3.5-F7.0; shutter
      2-1/1000 s, Night mode 8-1/1000 s; ISO Auto/100/200/400; EV +/-2.0 in 0.5 steps; 16 MB
      internal flash; SD/MMC "up to 512 MB guaranteed"; JPEG (DCF, EXIF 2.2), AVI (MJPEG)
      640x480/320x240 at 24/15 fps, WAV. Fixed focus with two-step manual switch.

  - id: S2
    title: Night scene shutter/aperture controls (user manual pages)
    kind: manual
    url: https://www.manualslib.com/manual/145735/Samsung-Digimax-A402.html?page=33
    retrieved: 2026-11-14
    redistributable: false
    notes: >-
      Night mode: +/- opens a setting screen; LEFT/RIGHT change shutter speed, UP/DOWN change
      aperture; +/- again saves. The text-extracted pages give no list of selectable shutter steps.
      Mirror: https://manualsdump.com/en/manuals/samsung-digimax_a402/205766/32

  - id: S3
    title: Samsung Digimax A402 service manual
    kind: service-manual
    url: https://www.manualslib.com/manual/4252216/Samsung-Digimax-A402.html
    retrieved: 2026-11-14
    pages: >-
      web p.32 (printed 34) firmware upgrade; web p.34 (printed 36) test mode / adjustment;
      web p.50 block diagram; web p.52 (printed 54) "SPCA536 DSP" schematic; web p.54 (printed 56)
      "SDRAM_TRAP_EEPROM"; web p.55 (printed 57) "FlashROM-NandFlash-SD"
    redistributable: false
    notes: >-
      Schematic pages are images; their net names have NOT been transcribed yet (see issue on
      schematic transcription). Upgrade: download "MEGA536" from the Samsung service site, copy it
      to the camera's removable disk over USB ("Do not use card Reader"), card formatted in-camera
      first; no extension or target folder stated. Test mode entry: remove card, hold OK while
      pressing POWER ~2 s, beep, press RIGHT. The adjustment table lists FIRMWARE UP, PUNT, MSCALIB,
      BATTERY, BAD PIXEL. Block diagram labels: Sunplus DSP with USB1.1, "SPCA535" (layout
      ambiguous), Panasonic MN39482 CCD, NN12030 (AFE?), RichTek RT9590 strobe charger, Sanyo LB1846M
      motor driver, Maxim MAX1567 power, Casio COM18T1824 1.8" TFT, 256 Mbit SDRAM, 16 MB NAND,
      93C66 EEPROM ("SYSTEM"), 27 MHz main and 32.768 kHz RTC crystals.

  - id: S4
    title: SD Association - SD/SDHC/SDXC/SDUC capacity overview
    kind: standard
    url: https://www.sdcard.org/developers/sd-standard-overview/capacity-sd-sdhc-sdxc-sduc/
    retrieved: 2026-11-14
    redistributable: false
    notes: SDSC <= 2 GB (FAT12/16), SDHC > 2 GB to 32 GB (FAT32), SDXC > 32 GB to 2 TB (exFAT).

  - id: S5
    title: SD Physical Layer Simplified Specification
    kind: standard
    url: https://www.sdcard.org/cms/wp-content/themes/sdcard-org/dl.php?f=Part1_Physical_Layer_Simplified_Specification_Ver7.10.pdf
    retrieved: 2026-11-14
    version: "7.10"
    redistributable: false
    notes: >-
      Basis for tools/digimax/sd: CMD8/ACMD41 HCS/CCS negotiation, OCR and CSD v1/v2/v3 layout,
      byte vs block addressing, CRC7/CRC16 (including the 512 x 0xFF -> 0x7FA1 example).

  - id: S6
    title: Linux kernel gspca Sunplus driver (sunplus.c)
    kind: source-code
    url: https://github.com/torvalds/linux/blob/master/drivers/media/usb/gspca/sunplus.c
    retrieved: 2026-11-14
    license: GPL-2.0-or-later
    redistributable: true
    notes: >-
      Webcam-mode driver for SPCA504/504B/504C/533/536 bridges. SPCA536 entries exist for other
      vendors (e.g. 04fc:5360, 055f:c211, 0733:3261); no Samsung Techwin (0839) device is listed.
      GPL: reference only, never copied into MIT code.

  - id: S7
    title: spca-fun (SPCA6350 research)
    kind: source-code
    url: https://github.com/mheistermann/spca-fun
    retrieved: 2026-11-14
    license: AGPL-3.0
    redistributable: true
    notes: Different, much newer SoC (SPCA6350, EKEN H9). Methodology inspiration only.

  - id: S8
