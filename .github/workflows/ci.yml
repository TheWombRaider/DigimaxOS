name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Install dosfstools (independent FAT cross-checks)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dosfstools
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Unit, property and fixture tests (no hardware)
        run: uv run pytest -q -m "not hardware"
      - name: CLI smoke test
        run: |
          uv run digimax --version
          uv run digimax sd frame 8 0x1AA
          uv run digimax --json exposure table > /dev/null
          ! uv run digimax capture   # must report unsupported (exit 3)

  safety:
    name: Public-safety scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/check_public_safety.py
      - name: Runtime dependency policy (stdlib only, ADR 0001)
        run: |
          python3 - <<'PY'
          import tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"]
          assert deps == [], f"runtime dependencies need an ADR: {deps}"
          print("runtime dependencies: none")
          PY

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
